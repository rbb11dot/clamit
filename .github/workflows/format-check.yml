name: Format Check

on:
  pull_request:
    branches: [main]

jobs:
  backend-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: test -z "$(go fmt ./...)"
