name: Release

on:
  push:
    tags: ["v*"]

jobs:
  backend-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/clamit-linux-amd64 ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/clamit-linux-arm64 ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/clamit-darwin-amd64 ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/clamit-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/clamit-windows-amd64.exe ./cmd/server

      - name: Create release archives
        run: |
          cd dist
          for f in clamit-*; do
            ext=""
            case "$f" in *.exe) ext=".exe" ;; esac
            platform="${f%$ext}"
            platform="${platform#clamit-}"
            tar czf "clamit-${platform}.tar.gz" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clamit-backend-release
          path: backend/dist/*.tar.gz

  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle wrapper --gradle-version 8.11.1

      - name: Build release APK
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: clamit-android-release
          path: android/app/build/outputs/apk/release/*.apk

  create-release:
    needs: [backend-release, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clamit-*
          merge-multiple: true

      - name: Generate release body
        run: |
          echo "## clamit ${{ github.ref_name }}" > release-body.md
          echo "" >> release-body.md
          echo "### Assets" >> release-body.md
          for f in *.tar.gz *.apk; do
            echo "- $f" >> release-body.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            *.tar.gz
            *.apk
