name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go vet ./...

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./... -v

  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build binaries (all platforms)
        run: |
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 go build -o dist/clamit-linux-amd64 ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -o dist/clamit-linux-arm64 ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -o dist/clamit-darwin-amd64 ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -o dist/clamit-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o dist/clamit-windows-amd64.exe ./cmd/server

      - uses: actions/upload-artifact@v4
        with:
          name: clamit-backend
          path: backend/dist/

  android-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle wrapper --gradle-version 9.5.0
      - run: gradle lint

  android-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle wrapper --gradle-version 9.5.0
      - run: gradle test

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle wrapper --gradle-version 9.5.0

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: clamit-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  continuous-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-build, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: clamit-*
          merge-multiple: true

      - name: Package release assets
        run: |
          mkdir -p release-assets
          for f in clamit-linux-amd64 clamit-linux-arm64 clamit-darwin-amd64 clamit-darwin-arm64 clamit-windows-amd64.exe; do
            if [ -f "$f" ]; then
              platform="${f%.exe}"
              tar czf "release-assets/${platform}.tar.gz" "$f"
            fi
          done
          if ls *.apk 1>/dev/null 2>&1; then
            cp *.apk release-assets/
          fi

      - name: Create or update continuous release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="continuous"
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "Continuous Build ($SHORT)" \
            --notes "Auto-built from commit $SHA on $(date -u '+%Y-%m-%d %H:%M UTC')." \
            --target "$SHA" \
            --prerelease \
            release-assets/*
